<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        .title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #25D366;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 60px;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            text-align: center;
        }
        .button {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        .button:hover {
            background-color: #1da851;
        }
        .button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 10px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }
        .status.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .status.info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .instructions {
            font-size: 11px;
            color: #666;
            margin-top: 10px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">🔔 Ping Everyone</div>
        
        <div class="input-group">
            <label for="userCount">Number of users to ping:</label>
            <input type="number" id="userCount" value="10" min="1" max="50">
        </div>
        
        <button id="pingButton" class="button">Start Ping</button>
        <button id="stopButton" class="button" disabled>Stop</button>
        
        <div id="status" class="status" style="display: none;"></div>
        
        <div class="instructions">
            <strong>Instructions:</strong><br>
            1. Open a WhatsApp group chat<br>
            2. Click in the message input box<br>
            3. Click "Start Ping" button<br>
            4. Add your message and send
        </div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
